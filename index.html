/* ---------- perhitungan laporan ---------- */
function calcReport() {
  const P = period(), f = P[0], t = P[1], inc = allIncome(), exp = allExpense();
  const before = r => f && r.tgl < f, within = r => inP(r.tgl, P);
  const awal = f ? sumJ(inc.filter(before)) - sumJ(exp.filter(before)) : 0;
  const incP = inc.filter(within), expP = exp.filter(within), masuk = sumJ(incP), keluar = sumJ(expP);
  const group = (rows, kf) => { const m = {}; rows.forEach(r => { const k = kf(r); m[k] = (m[k] || 0) + r.jml; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const upTo = r => !t || r.tgl <= t;
  const ids = new Set(posList().map(p => p[0])); inc.concat(exp).forEach(r => ids.add(r.pos));
  const pos = [...ids].map(id => {
    const im = sumJ(incP.filter(r => r.pos === id)), ek = sumJ(expP.filter(r => r.pos === id));
    return { id, nama: posName(id), masuk: im, keluar: ek, saldo: sumJ(inc.filter(r => r.pos === id && upTo(r))) - sumJ(exp.filter(r => r.pos === id && upTo(r))) };
  }).filter(p => p.masuk || p.keluar || p.saldo);
  const mm = {};
  incP.forEach(r => { const k = r.tgl.slice(0, 7); (mm[k] = mm[k] || { i: 0, o: 0 }).i += r.jml; });
  expP.forEach(r => { const k = r.tgl.slice(0, 7); (mm[k] = mm[k] || { i: 0, o: 0 }).o += r.jml; });
  let run = awal;
  const bulan = Object.keys(mm).sort().map(k => { run += mm[k].i - mm[k].o; return { k, masuk: mm[k].i, keluar: mm[k].o, saldo: run }; });
  const lines = [];
  expP.forEach(r => lines.push({ tgl: r.tgl, ur: r.kat + (r.ket ? ' – ' + r.ket : '') + ' [' + posName(r.pos) + ']', i: 0, o: r.jml }));
  incP.filter(r => r.src === 'manual').forEach(r => lines.push({ tgl: r.tgl, ur: r.kat + (r.ket ? ' – ' + r.ket : '') + ' [' + posName(r.pos) + ']', i: r.jml, o: 0 }));
  const g = {};
  incP.filter(r => r.src === 'tagihan').forEach(r => { const k = r.tgl + '|' + r.kat; const e = g[k] = g[k] || { tgl: r.tgl, kat: r.kat, n: 0, s: 0 }; e.n++; e.s += r.jml; });
  Object.values(g).forEach(x => lines.push({ tgl: x.tgl, ur: 'Tagihan ' + x.kat + ' (' + x.n + ' pembayaran)', i: x.s, o: 0 }));
  lines.sort((a, b) => a.tgl.localeCompare(b.tgl) || (b.i > 0) - (a.i > 0));
  let sal = awal; lines.forEach(l => { sal += l.i - l.o; l.saldo = sal; });
  const cat = {}, debt = [];
  S.warga.forEach(w => {
    let un = 0;
    dues(w).forEach(x => { const k = x.type === 't' ? x.id : x.type; const e = cat[k] = cat[k] || { tot: 0, paid: 0 }; e.tot += x.amt; if (x.paid) e.paid += x.amt; else un += x.amt; });
    if (un > 0) debt.push({ w, un });
  });
  debt.sort((a, b) => b.un - a.un);
  const tagih = Object.keys(cat).map(k => { const it = getItem(k); return { nama: it ? it.label : k, tot: cat[k].tot, paid: cat[k].paid, un: cat[k].tot - cat[k].paid }; });
  return { P, awal, masuk, keluar, akhir: awal + masuk - keluar, nMasuk: incP.length, nKeluar: expP.length,
    katMasuk: group(incP, r => r.kat), katKeluar: group(expP, r => r.kat), pos, bulan, lines, tagih, debt, debtTotal: debt.reduce((s, d) => s + d.un, 0),
    undated: incP.filter(r => r.est).length };
}

function laporanBody() {
  const R = calcReport(), sel = R.masuk - R.keluar;
  const act = `<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn" data-a="rPrint">${ico('receipt', 16)}Cetak / PDF</button><button class="btn ghost" data-a="rXlsx">${ico('download', 16)}Excel</button><button class="btn ghost" data-a="rShare">${ico('share', 16)}Bagikan WhatsApp</button></div>`;
  return act + `<div class="rpt-head"><h2>Laporan Keuangan</h2><p>${esc(S.org.name)} · ${esc(periodLabel())} · dicetak ${fmtD(todayStr())}</p></div>
  <div class="grid4">${kStat('wallet', 'Saldo awal', rp(R.awal), 'sebelum periode')}${kStat('trend', 'Pemasukan', rp(R.masuk), R.nMasuk + ' transaksi')}${kStat('receipt', 'Pengeluaran', rp(R.keluar), R.nKeluar + ' transaksi')}${kStat('check', 'Saldo akhir', rp(R.akhir), (sel >= 0 ? 'Surplus ' : 'Defisit ') + rp(Math.abs(sel)))}</div>
  ${R.undated ? `<p class="hint">${R.undated} pembayaran tagihan tidak punya tanggal bayar, dihitung di bulan tagihannya.</p>` : ''}
  <div class="grid2 sec"><div class="card"><h3>Pemasukan per kategori</h3>${bars(R.katMasuk, 'var(--ok)')}</div><div class="card"><h3>Pengeluaran per kategori</h3>${bars(R.katKeluar, 'var(--no)')}</div></div>
  <div class="card sec"><h3>Saldo per pos dana</h3><p class="sub">Pemasukan dan pengeluaran pada periode; saldo dihitung kumulatif sampai akhir periode</p>${R.pos.length ? tbl(['Pos', 'Pemasukan', 'Pengeluaran', 'Saldo'], R.pos.map(p => [esc(p.nama), rp(p.masuk), rp(p.keluar), `<b class="${p.saldo < 0 ? 'amt' : 'okt'}">${rp(p.saldo)}</b>`]).concat([{ tot: 1, c: ['Total', rp(R.masuk), rp(R.keluar), rp(R.pos.reduce((s, p) => s + p.saldo, 0))] }])) : '<p class="hint">Belum ada data.</p>'}</div>
  <div class="card sec"><h3>Arus kas per bulan</h3>${R.bulan.length ? tbl(['Bulan', 'Masuk', 'Keluar', 'Selisih', 'Saldo akhir'], R.bulan.map(b => [b.k ? mLabel(b.k) : 'Tanpa tanggal', rp(b.masuk), rp(b.keluar), `<b class="${b.masuk - b.keluar < 0 ? 'amt' : 'okt'}">${rp(b.masuk - b.keluar)}</b>`, rp(b.saldo)])) : '<p class="hint">Belum ada transaksi.</p>'}</div>
  <div class="card sec"><h3>Posisi tagihan warga</h3><p class="sub">Per hari ini, sesuai harga yang berlaku</p>${R.tagih.length ? tbl(['Item', 'Total tagihan', 'Terbayar', 'Tunggakan'], R.tagih.map(x => [esc(x.nama), rp(x.tot), rp(x.paid), `<b class="${x.un ? 'amt' : 'okt'}">${rp(x.un)}</b>`]).concat([{ tot: 1, c: ['Total', rp(R.tagih.reduce((s, x) => s + x.tot, 0)), rp(R.tagih.reduce((s, x) => s + x.paid, 0)), rp(R.debtTotal)] }])) : '<p class="hint">Belum ada data.</p>'}</div>
  <div class="card sec"><h3>Warga menunggak (${R.debt.length})</h3>${R.debt.length ? tbl(['Nama', 'Blok', 'Status', 'Tunggakan'], R.debt.map(d => [esc(d.w.nama), esc(d.w.alamat || ''), STATUS_LABEL[d.w.status], `<b class="amt">${rp(d.un)}</b>`])) : '<p class="hint">Semua warga lunas.</p>'}</div>
  <div class="card sec"><h3>Buku kas</h3><p class="sub">Pembayaran tagihan diringkas per tanggal dan kategori</p>${tbl(['Tanggal', 'Uraian', 'Masuk', 'Keluar', 'Saldo'], [[`<i>${f_(R)}</i>`, 'Saldo awal', '', '', rp(R.awal)]].concat(R.lines.map(l => [fmtD(l.tgl), esc(l.ur), l.i ? rp(l.i) : '', l.o ? rp(l.o) : '', rp(l.saldo)])))}</div>`;
}
const f_ = R => R.P[0] ? fmtD(R.P[0]) : '-';

function reportText() {
  const R = calcReport();
  let s = `*Laporan Keuangan*\n${S.org.name}\nPeriode: ${periodLabel()}\n\nSaldo awal: ${rp(R.awal)}\nPemasukan: ${rp(R.masuk)}\nPengeluaran: ${rp(R.keluar)}\n*Saldo akhir: ${rp(R.akhir)}*\n`;
  if (R.katMasuk.length) s += '\nPemasukan:\n' + R.katMasuk.map(x => '- ' + (x[0] || '-') + ': ' + rp(x[1])).join('\n') + '\n';
  if (R.katKeluar.length) s += '\nPengeluaran:\n' + R.katKeluar.map(x => '- ' + (x[0] || '-') + ': ' + rp(x[1])).join('\n') + '\n';
  if (R.pos.length) s += '\nSaldo per pos:\n' + R.pos.map(p => '- ' + p.nama + ': ' + rp(p.saldo)).join('\n') + '\n';
  s += `\nTunggakan warga: ${rp(R.debtTotal)} (${R.debt.length} warga)`;
  return s;
}
async function exportLaporan() {
  let X; try { toast('Menyiapkan file Excel...'); X = await loadXLSX(); } catch (e) { toast('Pustaka Excel gagal dimuat. Perlu internet.'); return; }
  const R = calcReport(), wb = X.utils.book_new();
  const add = (name, aoa, w) => { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = (w || []).map(x => ({ wch: x })); X.utils.book_append_sheet(wb, ws, name); };
  add('Ringkasan', [['Laporan Keuangan'], ['Organisasi', S.org.name], ['Periode', periodLabel()], [], ['Saldo awal', R.awal], ['Pemasukan', R.masuk], ['Pengeluaran', R.keluar], ['Saldo akhir', R.akhir], [], ['Tunggakan warga', R.debtTotal], ['Jumlah warga menunggak', R.debt.length]], [26, 30]);
  add('Per Kategori', [['Jenis', 'Kategori', 'Jumlah']].concat(R.katMasuk.map(x => ['Pemasukan', x[0], x[1]]), R.katKeluar.map(x => ['Pengeluaran', x[0], x[1]])), [14, 28, 16]);
  add('Per Pos', [['Pos', 'Pemasukan', 'Pengeluaran', 'Saldo']].concat(R.pos.map(p => [p.nama, p.masuk, p.keluar, p.saldo])), [28, 16, 16, 16]);
  add('Per Bulan', [['Bulan', 'Masuk', 'Keluar', 'Selisih', 'Saldo akhir']].concat(R.bulan.map(b => [b.k ? mLabel(b.k) : 'Tanpa tanggal', b.masuk, b.keluar, b.masuk - b.keluar, b.saldo])), [16, 16, 16, 16, 16]);
  add('Buku Kas', [['Tanggal', 'Uraian', 'Masuk', 'Keluar', 'Saldo'], ['', 'Saldo awal', '', '', R.awal]].concat(R.lines.map(l => [l.tgl, l.ur, l.i || '', l.o || '', l.saldo])), [14, 60, 14, 14, 16]);
  add('Posisi Tagihan', [['Item', 'Total tagihan', 'Terbayar', 'Tunggakan']].concat(R.tagih.map(x => [x.nama, x.tot, x.paid, x.un])), [28, 16, 16, 16]);
  add('Tunggakan', [['Nama', 'Blok', 'Status', 'Tunggakan']].concat(R.debt.map(d => [d.w.nama, d.w.alamat || '', STATUS_LABEL[d.w.status], d.un])), [30, 12, 12, 16]);
  X.writeFile(wb, 'laporan-keuangan-' + todayStr() + '.xlsx');
}

Object.assign(ACT, {
  ktab(el) { ui.ktab = el.dataset.v; ui.kq = ''; ui.ksrc = 'all'; ui.lim = 100; render(); },
  kp(el) {
    ui.kp = el.dataset.v; ui.lim = 100;
    if (ui.kp === 'custom' && !ui.kf && !ui.kt) { const t = todayStr(); ui.kf = t.slice(0, 8) + '01'; ui.kt = t; }
    render();
  },
  ksrc(el) { ui.ksrc = el.dataset.v; ui.lim = 100; renderK(); },
  kmore() { ui.lim += 200; renderK(); },
  xAdd(el) { trxModal(el.dataset.tp, null); },
  xEdit(el) { trxModal(null, el.dataset.k); },
  xSave(el) {
    const tgl = $('#xT').value, jml = Math.round(+$('#xJ').value || 0);
    if (!tgl) { toast('Tanggal wajib diisi'); return; }
    if (jml <= 0) { toast('Jumlah harus lebih dari 0'); return; }
    const data = { tgl, kat: $('#xK').value.trim() || 'Lainnya', ket: $('#xE').value.trim(), jml, pos: $('#xP').value };
    const id = el.dataset.k;
    if (id) Object.assign(S.trx.find(x => x.id === id), data); else S.trx.push(Object.assign({ id: uid('x'), tipe: el.dataset.tp }, data));
    save(); closeModal(); render(); toast('Tersimpan');
  },
  xDel(el) {
    const x = S.trx.find(r => r.id === el.dataset.k);
    if (!x || !confirm('Hapus transaksi ' + (x.kat || '') + ' sebesar ' + rp(x.jml) + '?')) return;
    S.trx = S.trx.filter(r => r.id !== x.id); save(); closeModal(); render();
  },
  pEdit(el) { payModal(el.dataset.k); },
  pSave(el) {
    const k = el.dataset.k; if (!S.paid[k]) return;
    S.paid[k] = { d: $('#pD').value || '', a: Math.max(0, Math.round(+$('#pA').value || 0)) };
    save(); closeModal(); render(); toast('Tersimpan');
  },
  pUnpaid(el) { delete S.paid[el.dataset.k]; save(); closeModal(); render(); },
  rPrint() { window.print(); },
  rXlsx() { exportLaporan(); },
  async rShare() {
    const text = reportText();
    if (navigator.share) { try { await navigator.share({ text, title: 'Laporan Keuangan' }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }
});
Object.assign(CH, {
  kf(el) { ui.kf = el.value; ui.lim = 100; renderK(); },
  kt(el) { ui.kt = el.value; ui.lim = 100; renderK(); }
});

/* ============ KONEKSI & LOGIN ============ */
function readCfg() {
  if (SB_DEFAULT.url && SB_DEFAULT.key) return SB_DEFAULT;
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; }
}
function gate(html) { document.body.classList.add('gate'); closeModal(); $('#main').innerHTML = '<div class="card gatebox">' + html + '</div>'; }
function showSetup(msg) {
  const c = readCfg() || {};
  gate(`<h2>Hubungkan Supabase</h2><p class="sub">Salin dari Supabase &gt; Project Settings &gt; API.</p>
    <label>Project URL</label><input id="gUrl" value="${esc(c.url || '')}" placeholder="https://xxxx.supabase.co" autocapitalize="off">
    <label>Anon (public) key</label><input id="gKey" value="${esc(c.key || '')}" placeholder="eyJ... atau sb_publishable_..." autocapitalize="off">
    <div class="err">${esc(msg || '')}</div><button class="btn" data-a="cfgSave">Simpan &amp; lanjut</button>`);
}
function showLogin(msg) {
  gate(`<h2>Masuk</h2><p class="sub">Khusus pengurus. Akun dibuat di Supabase &gt; Authentication &gt; Users.</p>
    <label>Email</label><input id="gEmail" type="email" autocomplete="username" autocapitalize="off">
    <label>Kata sandi</label><input id="gPass" type="password" autocomplete="current-password">
    <div class="err">${esc(msg || '')}</div><button class="btn" data-a="login">Masuk</button>${(SB_DEFAULT.url && SB_DEFAULT.key) ? '' : '<button class="btn ghost" data-a="cfgReset">Ubah koneksi Supabase</button>'}`);
}
async function start() {
  gate('<div class="empty">Memuat data...</div>');
  try { S = await loadDb(); }
  catch (e) {
    gate(`<h2>Gagal memuat data</h2><div class="err">${esc(e.message || String(e))}\n\nPastikan schema.sql, keuangan.sql, dan riwayat-status.sql sudah dijalankan di Supabase.</div><button class="btn" data-a="retryLoad">Coba lagi</button><button class="btn ghost" data-a="logout">Keluar</button>`);
    return;
  }
  const push = S._push; delete S._push;
  document.body.classList.remove('gate'); setSync('ok'); render();
  if (push) save();
}
async function boot() {
  const c = readCfg();
  if (!c || !c.url || !c.key) return showSetup();
  if (!window.supabase) { gate('<h2>Pustaka Supabase gagal dimuat</h2><p class="sub">Perlu koneksi internet. Muat ulang halaman.</p>'); return; }
  try {
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
    sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'tagihan-warga-auth' } });
    const { data } = await sb.auth.getSession();
    if (!data.session) return showLogin();
  } catch (e) { return showSetup('URL atau key tidak valid.'); }
  start();
}
Object.assign(ACT, {
  cfgSave() {
    const url = ($('#gUrl').value || '').trim().replace(/\/+$/, ''), key = ($('#gKey').value || '').trim();
    if (!/^https:\/\/.+\..+/.test(url) || key.length < 20) { showSetup('Isi URL (https://...) dan key dengan benar.'); return; }
    try { localStorage.setItem(CFG_KEY, JSON.stringify({ url, key })); } catch (e) {}
    boot();
  },
  cfgCopy() {
    const t = $('#cfgLine'); if (!t) return; t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Baris disalin'), () => { try { document.execCommand('copy'); toast('Baris disalin'); } catch (e) { toast('Salin manual dari kotak'); } });
  },
  cfgReset() { try { localStorage.removeItem(CFG_KEY); } catch (e) {} showSetup(); },
  async login() {
    const email = ($('#gEmail').value || '').trim(), password = $('#gPass').value || '';
    if (!email || !password) { showLogin('Isi email dan kata sandi.'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showLogin('Email atau kata sandi salah.'); return; }
    start();
  },
  async logout() { try { await sb.auth.signOut(); } catch (e) {} S = emptyState(); snap = null; showLogin(); },
  retryLoad() { start(); },
  syncNow() { save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && (e.target.id === 'gPass' || e.target.id === 'gEmail')) ACT.login(); });

boot();
</script>
