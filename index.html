<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagihan Warga & Kasir Pos</title>
<!-- Midtrans Snap JS (Sandbox bawaan, otomatis switch ke Production jika diatur di Pengaturan) -->
<script id="midtrans-snap-script" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key=""></script>

<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#2b3042;--mut:#8a90a6;--line:#eceef5;--acc:#6f86d6;--acc-s:#eef1fc;--ok:#3d8a5f;--ok-s:#e7f5ed;--no:#c25b5b;--no-s:#fdeeee;--warn:#b7822f;--warn-s:#fff4e0;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
.ico{flex:none;display:block}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--acc)}
.brand b{color:var(--ink);font-size:16px;letter-spacing:-.2px}
.side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;text-align:left;font-weight:500}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--acc-s);color:var(--acc)}
.side .foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg);color:var(--mut);font-size:12px;display:flex;gap:10px;align-items:flex-start}
.bottom{display:none}
main{padding:28px 32px 60px;max-width:1280px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;letter-spacing:-.4px}
.head p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{margin:0 0 14px;color:var(--mut);font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .top{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.stat .top .ico{color:var(--acc)}
.stat b{font-size:22px;letter-spacing:-.4px}
.stat small{color:var(--mut)}
.bar{height:8px;border-radius:8px;background:var(--acc-s);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.cat{margin:12px 0}
.cat .row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.cat .row span:last-child{color:var(--mut)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.li:hover{background:var(--bg)}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--mut)}
.amt{font-weight:600;color:var(--no)}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc-s);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--acc);color:#fff;padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:var(--acc-s);color:var(--acc)}
.btn.danger{background:var(--no-s);color:var(--no)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.ib{border:0;background:none;width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
.ib:hover{background:var(--acc-s);color:var(--acc)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--mut);cursor:pointer;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--acc-s);color:var(--acc)}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;min-width:220px;flex:1;max-width:320px}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:36px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-s);border-color:var(--acc)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
.tbl-wrap{overflow:auto;border-radius:var(--r);background:#fff;border:1px solid var(--line);max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
th{background:#fafbfe;color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;z-index:2}
th small{display:block;font-weight:400;font-size:10px;opacity:.8}
th.cur{color:var(--acc);background:var(--acc-s)}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;border-right:1px solid var(--line)}
th:first-child{z-index:3;background:#fafbfe}
td.l,th.l{text-align:left}
td.r{text-align:right}
.nm{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;text-align:left;padding:0}
.nm span b{display:block;font-weight:600}
.nm small{color:var(--mut);font-size:11px;display:block}
.nm:hover b{color:var(--acc)}
.chip{border:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;min-width:62px}
.chip.ok{background:var(--ok-s);color:var(--ok)}
.chip.no{background:var(--no-s);color:var(--no)}
.chip.fut{opacity:.5;background:var(--bg);color:var(--mut)}
.chip:active{transform:scale(.96)}
.na{color:#c9cddb}
.sum small{display:block;color:var(--mut);font-size:11px}
.sum b{color:var(--no)}
.okt{color:var(--ok);font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.b-singgah{background:var(--warn-s);color:var(--warn)}
.b-kontrak{background:var(--acc-s);color:var(--acc)}
.b-tetap{background:var(--ok-s);color:var(--ok)}
.tabs{display:flex;gap:4px;overflow:auto;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 14px;border-radius:10px 10px 0 0;color:var(--mut);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.tab.on{background:#fff;color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc);font-weight:600}
.tab.add{color:var(--acc)}
.info{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;border-radius:14px;background:var(--acc-s);color:var(--ink)}
.info .grow{flex:1;min-width:180px}
.info small{color:var(--mut);display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.legend{display:flex;gap:14px;color:var(--mut);font-size:12px;margin-top:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty .ico{margin:0 auto 10px;color:var(--acc)}
.backdrop{position:fixed;inset:0;background:rgba(43,48,66,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.sheet{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(43,48,66,.2)}
.sheet.wide{max-width:520px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h3{margin:0;font-size:17px}
.sheet label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three label{margin-top:0}
.chk{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-top:6px}
.chk label{display:flex;gap:8px;align-items:center;margin:0;padding:5px 0;font-size:14px;color:var(--ink);font-weight:400}
.radios{display:flex;gap:16px;margin-top:4px}
.radios label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:14px;font-weight:500}
.invimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:13px;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.set-grid{display:grid;gap:14px}
.ptable input[type=month]{padding:6px 8px;min-width:140px}
.ptable td,.ptable th{text-align:left}
.bulk{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--bg);padding:12px;border-radius:14px;margin:12px 0}
.bulk>div{min-width:140px}
.bulk .lbl{margin-top:0}
.pr input{width:120px;text-align:right}
.hint{color:var(--mut);font-size:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hrow span:first-child{flex:1;color:var(--mut)}
.hrow:last-child{border-bottom:0}
.cfgline{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
body.gate .side,body.gate .bottom{display:none}
body.gate .app{display:block}
.gatebox{max-width:420px;margin:8vh auto 0}
.gatebox h2{margin:0 0 4px;font-size:20px}
.gatebox label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.gatebox .err{color:var(--no);font-size:13px;margin-top:10px;white-space:pre-wrap}
.gatebox .btn{margin-top:14px;width:100%;justify-content:center}
th.r{text-align:right}
.rpt-head{margin:0 0 14px}
.rpt-head h2{margin:0;font-size:20px}
.rpt-head p{margin:2px 0 0;color:var(--mut)}
.sec{margin-top:14px}
.sec h3{margin:0 0 10px}
.tot td{font-weight:700;background:#fafbfe}
@media print{
  .side,.bottom,.noprint,#toast{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  body{background:#fff}
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  th{position:static}
  th:first-child,td:first-child{position:static}
  th,td{padding:5px 8px}
  .card{break-inside:avoid}
}
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  main{padding:18px 14px 110px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px;cursor:pointer;border-radius:12px}
  .bottom button.on{color:var(--acc)}
  .grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .head h1{font-size:21px}
  .tbl-wrap{max-height:calc(100vh - 300px)}
  .backdrop{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-width:none}
  #toast{bottom:100px}
}

/* ============ KASIR POS STYLES ============ */
.pos-container{display:grid;grid-template-columns:1.2fr 0.8fr;gap:18px;align-items:start}
@media(max-width:960px){.pos-container{grid-template-columns:1fr}}
.pos-subnav{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.pos-subnav button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.pos-subnav button.on{background:var(--acc-s);color:var(--acc)}
.pos-search-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;margin-bottom:14px}
.pos-search-box{position:relative}
.pos-search-box input{padding-left:42px;font-size:15px;height:48px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.pos-search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.pos-search-box .clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;padding:6px;font-size:14px}
.pos-dropdown{border:1px solid var(--line);border-radius:14px;background:#fff;max-height:300px;overflow-y:auto;box-shadow:0 14px 34px rgba(0,0,0,.1);position:absolute;left:20px;right:20px;top:76px;z-index:40}
.pos-drop-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.pos-drop-item:last-child{border-bottom:0}
.pos-drop-item:hover{background:var(--acc-s)}
.pos-drop-item .badge-addr{background:var(--acc);color:#fff;font-weight:700;padding:4px 9px;border-radius:8px;font-size:12px;flex:none}
.pos-drop-item .info{background:none;padding:0;margin:0;display:block}
.pos-drop-item .info b{font-size:14px;color:var(--ink);display:block}
.pos-drop-item .info small{color:var(--mut);font-size:12px}
.pos-drop-item .debt{margin-left:auto;text-align:right}
.pos-drop-item .debt b{color:var(--no);font-size:13px}
.pos-drop-item .debt small{color:var(--mut);display:block;font-size:11px}

.pos-w-card{background:linear-gradient(135deg, #f7f9ff 0%, #edf2fe 100%);border:1px solid #d4defc;border-radius:16px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pos-w-info{display:flex;align-items:center;gap:14px}
.pos-w-info .av-lg{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none}
.pos-w-meta h3{margin:0 0 2px;font-size:17px;color:var(--ink);letter-spacing:-.3px}
.pos-w-meta p{margin:0;color:var(--mut);font-size:13px;display:flex;align-items:center;gap:8px}

.pos-table-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.pos-table-head{background:#fafbfe;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pos-table-head b{font-size:13px;color:var(--mut)}
.pos-items-list{max-height:380px;overflow-y:auto}
.pos-item-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.pos-item-row:last-child{border-bottom:0}
.pos-item-row:hover{background:#f8f9fd}
.pos-item-row.checked{background:#f3f6ff}
.pos-item-desc{flex:1;min-width:0}
.pos-item-desc b{display:block;font-size:14px;color:var(--ink)}
.pos-item-desc small{color:var(--mut);font-size:12px}
.pos-item-amt{font-size:14.5px;font-weight:700;color:var(--ink);text-align:right}

.pos-pay-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:20px}
.pos-tot-box{background:var(--acc-s);border:1px solid #d4defc;border-radius:14px;padding:16px 18px;text-align:center;margin-bottom:16px}
.pos-tot-box small{color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:block}
.pos-tot-box .tot-val{font-size:34px;font-weight:800;color:#203160;letter-spacing:-.8px;margin:3px 0}
.pos-tot-box .tot-cnt{color:var(--mut);font-size:12.5px}

.pos-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:12px}
.pos-tab-btn{border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);transition:.15s}
.pos-tab-btn.on{background:#fff;color:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.06)}

.pos-channel-badge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.pos-ch{background:#edf0f7;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:600;color:var(--ink)}

.pos-cash-input{position:relative;margin-bottom:10px}
.pos-cash-input input{font-size:19px;font-weight:700;padding-left:38px;height:48px;color:var(--ink)}
.pos-cash-input span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mut);font-size:16px}
.pos-quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.pos-quick-cash button{border:1px solid var(--line);background:#fff;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);transition:.1s}
.pos-quick-cash button:hover{background:var(--acc-s);border-color:var(--acc);color:var(--acc)}

.pos-change-box{background:#fafbfe;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.pos-change-box small{color:var(--mut);font-size:13px;display:block}
.pos-change-box b{font-size:19px;font-weight:700}
.pos-change-box.ok b{color:var(--ok)}
.pos-change-box.short b{color:var(--no)}

.pos-btn-pay{width:100%;height:48px;font-size:15px;font-weight:700;border-radius:12px;justify-content:center;cursor:pointer}
.pos-btn-pay.midtrans{background:linear-gradient(135deg, #1872f0 0%, #0a4fba 100%);color:#fff;border:0}
.pos-btn-pay.midtrans:hover{filter:brightness(1.05)}
.pos-btn-pay.cash{background:linear-gradient(135deg, #2ea363 0%, #1f7d49 100%);color:#fff;border:0}
.pos-btn-pay.cash:hover{filter:brightness(1.05)}
.pos-btn-pay:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(1)}

/* Thermal Receipt Styling */
.thermal-receipt{width:100%;max-width:320px;margin:0 auto;background:#fff;padding:18px 16px;font-family:'Courier New',Courier,monospace;color:#111;font-size:12px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.08);border:1px dashed #ccc;border-radius:6px}
.thermal-receipt .th-center{text-align:center}
.thermal-receipt .th-title{font-size:15px;font-weight:bold;margin:0 0 2px}
.thermal-receipt .th-sub{font-size:11px;color:#555;margin:0 0 8px}
.thermal-receipt .th-div{border-top:1px dashed #777;margin:8px 0}
.thermal-receipt .th-div-double{border-top:2px double #444;margin:8px 0}
.thermal-receipt .th-row{display:flex;justify-content:space-between;margin:3px 0}
.thermal-receipt .th-bold{font-weight:bold}
.thermal-receipt .th-item-name{font-weight:bold}
.thermal-receipt .th-item-sub{font-size:11px;color:#444;margin-left:8px}
.thermal-receipt .th-qr{text-align:center;margin:12px 0 6px}
.thermal-receipt .th-qr img{display:inline-block;width:96px;height:96px;border-radius:6px}
.thermal-receipt .th-code{font-size:10.5px;letter-spacing:1px;text-align:center;color:#444}
.thermal-receipt .th-foot{font-size:10.5px;color:#666;text-align:center;margin-top:10px}

/* Print Receipt Mode */
@media print {
  body.printing-receipt .app,
  body.printing-receipt .side,
  body.printing-receipt .bottom,
  body.printing-receipt #toast,
  body.printing-receipt .backdrop .mf,
  body.printing-receipt .backdrop .mh { display:none !important; }
  body.printing-receipt .backdrop { position:static !important; background:none !important; padding:0 !important; }
  body.printing-receipt .sheet { box-shadow:none !important; border:0 !important; max-width:100% !important; padding:0 !important; }
  body.printing-receipt .thermal-receipt { box-shadow:none !important; border:0 !important; max-width:80mm !important; width:100% !important; padding:4px 0 !important; }
}


/* ==============================================================================
   MODERN UI/UX, ANIMATIONS & 3-CONTAINER PRODUCT ARCHITECTURE
   ============================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --acc: #2563eb;
  --acc-s: #eff6ff;
  --pri: #1d4ed8;
  --pri-s: #eff6ff;
  --pri-b: #bfdbfe;
  --sec: #7c3aed;
  --sec-s: #f5f3ff;
  --sec-b: #ddd6fe;
  --tam: #059669;
  --tam-s: #ecfdf5;
  --tam-b: #a7f3d0;
  --ok: #16a34a;
  --ok-s: #dcfce7;
  --no: #dc2626;
  --no-s: #fee2e2;
  --warn: #d97706;
  --warn-s: #fef3c7;
  --r: 16px;
  --r-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 6px 24px -2px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 20px 40px -4px rgba(15, 23, 42, 0.12);
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  background: var(--bg);
  color: var(--ink);
  letter-spacing: -0.01em;
}

/* Clean, Snappy Transitions (No Overdone Animations) */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(8px) saturate(180%);
  display: flex; align-items: center; justify-content: center;
  padding: 18px; z-index: 100;
  animation: fadeIn 0.12s ease forwards;
}

.sheet {
  background: #fff;
  border-radius: var(--r-lg);
  padding: 24px;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalFadeIn 0.15s ease forwards;
  border: 1px solid rgba(255,255,255,0.8);
}

.sheet.wide { max-width: 620px; }

/* Micro-transitions */
button, input, select, .chip, .pos-drop-item, .prod-item-row {
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
}


/* User Mode Top Header */
.user-topbar {
  background: #ffffff;
  border-bottom: 1px solid var(--line);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: var(--shadow-sm);
  animation: slideDown 0.3s ease;
}

.user-top-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-badge-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--acc) 0%, #1e40af 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

.user-top-brand h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
}

.user-top-brand p {
  margin: 0;
  font-size: 12px;
  color: var(--mut);
}

.user-mode-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: #ecfdf5;
  color: #059669;
  border: 1px solid #a7f3d0;
}

.user-mode-pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  display: inline-block;
  
}

.btn-admin-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: #ffffff;
  color: var(--ink);
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

.btn-admin-switch:hover {
  background: var(--acc-s);
  border-color: var(--acc);
  color: var(--acc);
  
}

/* User Mode Body State */
body.mode-user .side { display: none !important; }
body.mode-user .bottom { display: none !important; }
body.mode-user .app { display: block !important; }
body.mode-user main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 24px 20px 80px;
  width: 100%;
}

/* Admin Top Bar Banner */
.admin-mode-banner {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #fff;
  padding: 12px 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);

}

.admin-mode-banner b {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}

/* 3 Product Containers Styling */
.prod-containers {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.prod-card {
  background: #ffffff;
  border: 1px solid var(--line);

  box-shadow: var(--shadow);

}

}

.prod-card.pri { border-color: var(--pri-b); }

}

.prod-card.sec { border-color: var(--sec-b); }

}

.prod-header {

}

.prod-title-group {

}

.prod-icon-box {

}

.prod-title-group h4 {

  font-size: 16px;
  font-weight: 700;
  color: #fff;

  align-items: center;
  gap: 8px;
}

.prod-badge-tag {

  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.25);

}

.prod-title-group p {

}

.prod-header-actions {

}

.prod-subtot-badge {

  border-radius: 10px;
  font-weight: 700;
  font-size: 13.5px;

}

.btn-prod-quick {

  background: rgba(255,255,255,0.15);

  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;

}

  background: #fff;
  color: var(--ink);
}

.prod-items-list {
  padding: 6px 0;

  overflow-y: auto;
}

.prod-item-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;

}

.prod-item-row:last-child { border-bottom: 0; }

.prod-item-desc { flex: 1; min-width: 0; }
.prod-item-desc b { display: block; font-size: 14px; color: var(--ink); }
.prod-item-desc small { color: var(--mut); font-size: 12px; }

.prod-item-price {
  font-weight: 700;
  font-size: 14.5px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.prod-empty-box {
  padding: 22px;
  text-align: center;
  color: var(--ok);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

}

/* Checkout Summary Breakdown */
.checkout-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  position: sticky;

}

.checkout-summary-breakdown {

}

.breakdown-row {

  font-size: 13px;

}

.breakdown-row.pri b { color: var(--pri); font-weight: 700; }
.breakdown-row.sec b { color: var(--sec); font-weight: 700; }
.breakdown-row.tam b { color: var(--tam); font-weight: 700; }

.breakdown-divider {

.breakdown-grand {

.breakdown-grand .grand-val {

/* ==============================================================================
   ANIMATED HERO LANDING PAGE & USER TRANSACTION VIEW
   ============================================================================== */
.hero-landing {

.hero-badge-pill {

/* ==============================================================================
   TEMA MINIMALIS: container seragam, item berbentuk tombol, keranjang
   ============================================================================== */
/* Satu aksen, minim gradasi */
.brand-badge-icon{background:var(--acc);box-shadow:0 4px 12px -2px rgba(37,99,235,.35)}
.gradient-text{background:none;-webkit-text-fill-color:currentColor;color:var(--acc)}
.pos-w-card{background:var(--acc-s);border:1px solid #dbeafe}
.pos-w-info .av-lg{background:var(--acc)}
.pos-btn-pay{display:inline-flex;align-items:center;gap:8px}
.pos-btn-pay.midtrans{background:var(--acc);box-shadow:0 10px 22px -8px rgba(37,99,235,.55)}
.pos-btn-pay.cash{background:var(--ok);box-shadow:0 10px 22px -8px rgba(22,163,74,.5)}
.pos-btn-pay.midtrans:hover,.pos-btn-pay.cash:hover{filter:brightness(1.04)}
.breakdown-row.pri b,.breakdown-row.sec b,.breakdown-row.tam b{color:var(--ink)}
.checkout-panel{border-radius:var(--r-lg)}
@media(min-width:961px){.checkout-panel{max-height:calc(100vh - 110px);overflow-y:auto}}
.checkout-panel.flash{animation:kpFlash 1s ease}
@keyframes kpFlash{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 7px rgba(37,99,235,.22)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}

/* Tombol checkout (kanan atas) */
.cart-btn{position:relative;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 14px;border:0;border-radius:14px;cursor:pointer;color:#fff;font-weight:700;background:linear-gradient(135deg,#e8590c 0%,#c2410c 100%);box-shadow:0 6px 18px rgba(194,65,12,.40);transition:transform .15s,filter .15s}
.cart-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.cart-btn:focus-visible{outline:3px solid #fed7aa;outline-offset:2px}
.cart-btn .ico{flex:none}
.cart-btn .ct{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.cart-btn .ct small{font-size:10.5px;font-weight:600;opacity:.95}
.cart-btn .ct b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart-badge{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:#fff;color:#c2410c;border:2px solid #c2410c;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cart-btn.bump{animation:cartBump .4s ease}
@keyframes cartBump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media(max-width:700px){
  .user-topbar{padding:10px 14px;gap:8px}
  .user-top-brand p,.user-mode-pill{display:none}

const ico = (n, s = 20) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const pad2 = n => String(n).padStart(2, '0');
const cur = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const mLabel = ym => MONTHS_ID[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4);
const fmtDate = d => d.getDate() + ' ' + MONTHS_FULL[d.getMonth()] + ' ' + d.getFullYear();
const initial = n => (n || '?').trim().charAt(0).toUpperCase();

function monthsBetween(a, b) {
  const out = [];
  if (!a || !b || a > b) return out;
  let y = +a.slice(0, 4), m = +a.slice(5);
  const y2 = +b.slice(0, 4), m2 = +b.slice(5);
  while ((y < y2 || (y === y2 && m <= m2)) && out.length < 120) {
    out.push(y + '-' + pad2(m));
    m++; if (m > 12) { m = 1; y++; }

}
function compressMonths(arr) {
  const a = [...arr].sort();
  if (!a.length) return '';
  const groups = []; let g = [a[0]];
  for (let i = 1; i < a.length; i++) {
    if (monthsBetween(a[i - 1], a[i]).length === 2) g.push(a[i]);
    else { groups.push(g); g = [a[i]]; }
  }
  groups.push(g);
  return groups.map(g => {
    const f = g[0], l = g[g.length - 1];
    if (f === l) return mLabel(f);
    return f.slice(0, 4) === l.slice(0, 4) ? MONTHS_ID[+f.slice(5) - 1] + '–' + mLabel(l) : mLabel(f) + '–' + mLabel(l);

/* ============ DATA (Supabase) ============
   S tetap berada di memori. load: loadDb() dari Supabase.
   save(): hitung selisih dengan snapshot terakhir lalu kirim hanya baris yang berubah. */
/* ===== SETUP SUPABASE CUKUP SEKALI =====
   Isi url & key di bawah ini SATU KALI (Supabase > Project Settings > API: Project URL + anon/public key),
   lalu simpan & upload ulang file ini. Setelah itu halaman setup tidak pernah muncul lagi di perangkat/alamat mana pun.
   Anon key memang publik; data tetap aman karena dilindungi login + RLS. JANGAN pakai service_role key. */
const SB_DEFAULT = { url: '', key: '' };
const CFG_KEY = 'tagihan-warga-sb';
let sb = null, snap = null, saveT = 0, saving = Promise.resolve(), syncState = 'ok';
const SYNC_TXT = { ok: 'Tersimpan di Supabase', pending: 'Menunggu simpan...', saving: 'Menyimpan...', err: 'Gagal simpan. Ketuk untuk coba lagi' };
const ORDER = ['settings', 'warga', 'status_log', 'items', 'payments', 'transaksi'];
const PK = { settings: 'id', warga: 'id', status_log: 'key', items: 'id', payments: 'key', transaksi: 'id' };

/* ============ RIWAYAT STATUS TINGGAL ============
   w.status  = status SAAT INI (turunan dari riwayat, dipakai tampilan umum)
   w.hist    = [{ m:'YYYY-MM' (mulai berlaku), s:status }] urut naik; entri pertama m='1900-01' = status awal.
   Harga tiap bulan memakai status yang berlaku di bulan itu, jadi ganti status hanya berdampak ke bulan mulai berlaku dan seterusnya.
   Pembayaran lunas menyimpan nominalnya sendiri (amount) sehingga tidak ikut berubah. */
const BASE_M = '1900-01';
function stAt(w, ym) {
  const h = w.hist;
  if (!h || !h.length) return w.status;
  let r = h[0].s;
  for (const e of h) { if (e.m <= ym) r = e.s; else break; }
  return r;
}
function normHist(w) {
  if (!w.hist || !w.hist.length) return;
  w.hist.sort((a, b) => (a.m < b.m ? -1 : a.m > b.m ? 1 : 0));
  w.hist = w.hist.filter((e, i, a) => i === 0 || a[i - 1].s !== e.s);
  w.status = stAt(w, cur());
}
function setStatus(w, st, m) {
  if (!w.hist || !w.hist.length) w.hist = [{ m: BASE_M, s: w.status }];
  const i = w.hist.findIndex(e => e.m === m);
  if (i >= 0) w.hist[i].s = st; else w.hist.push({ m, s: st });
  normHist(w);
}
const paidAmt = k => { const v = S.paid[k]; return (v && typeof v === 'object' && v.a != null) ? v.a : null; };
function mAmt(t, w, m) { const a = paidAmt(t + '|' + w.id + '|' + m); return a != null ? a : (S.items[t].prices[stAt(w, m)] || 0); }
function tAmt(it, w) { const a = paidAmt('t|' + it.id + '|' + w.id); return a != null ? a : (it.prices[w.status] || 0); }

function emptyState() {
  const c = cur(), z = () => ({ singgah: 0, kontrak: 0, tetap: 0 });
  return { org: { name: 'Paguyuban Warga', pay: '' }, def: { kas: c, dayak: c },
    items: { kas: { label: 'Kas Warga', prices: z() }, dayak: { label: 'Gaji Dayak', prices: z() } },
    tambahan: [], warga: [], paid: {}, trx: [], sheetUrl: '' };
}
function toRows(s) {
  const r = { settings: {}, warga: {}, status_log: {}, items: {}, payments: {}, transaksi: {} }, ids = new Set();
  r.settings['1'] = { id: 1, org_name: s.org.name || '', pay_info: s.org.pay || '', def_kas: s.def.kas || '', def_dayak: s.def.dayak || '', sheet_url: s.sheetUrl || '' };
  s.warga.forEach((w, i) => {
    ids.add(w.id);
    r.warga[w.id] = { id: w.id, nama: w.nama, alamat: w.alamat || '', wa: w.wa || '', status: w.status, kas_from: w.kasFrom || '', kas_to: w.kasTo || '', dayak_from: w.dayakFrom || '', dayak_to: w.dayakTo || '', sort: i };
    (w.hist || []).forEach(e => { const k = w.id + '|' + e.m; r.status_log[k] = { key: k, warga_id: w.id, mulai: e.m, status: e.s }; });
  });
  const it = (id, kind, x, n, target) => { r.items[id] = { id, kind, label: x.label, price_singgah: x.prices.singgah || 0, price_kontrak: x.prices.kontrak || 0, price_tetap: x.prices.tetap || 0, target, sort: n }; };
  it('kas', 'kas', s.items.kas, 0, null); it('dayak', 'dayak', s.items.dayak, 1, null);
  s.tambahan.forEach((x, i) => it(x.id, 'tambahan', x, i + 2, x.target === 'all' ? null : x.target));
  for (const k in s.paid) {
    const p = k.split('|'), t = p[0] === 't', wid = t ? p[2] : p[1];
    if (ids.has(wid)) { const v = s.paid[k], o = (v && typeof v === 'object') ? v : null; r.payments[k] = { key: k, jenis: p[0], warga_id: wid, ref: t ? p[1] : p[2], paid_at: (o && o.d) || null, amount: (o && o.a != null) ? o.a : null }; }
  }
  (s.trx || []).forEach(x => { r.transaksi[x.id] = { id: x.id, tipe: x.tipe, tanggal: x.tgl, kategori: x.kat || '', keterangan: x.ket || '', jumlah: Math.round(x.jml) || 0, pos: x.pos || 'umum' }; });
  return r;
}
async function fetchAll(tbl, order) {
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(tbl).select('*'); if (order) q = q.order(order);
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function loadDb() {
  const [st, wr, it, pm, tx] = await Promise.all([fetchAll('settings'), fetchAll('warga', 'sort'), fetchAll('items', 'sort'), fetchAll('payments', 'key'), fetchAll('transaksi', 'id')]);
  let sl;
  try { sl = await fetchAll('status_log', 'mulai'); }
  catch (e) { throw new Error('Tabel status_log belum ada. Jalankan riwayat-status.sql di Supabase > SQL Editor (cukup sekali).\n(' + (e.message || e) + ')'); }
  const n = emptyState();
  if (st[0]) { n.org.name = st[0].org_name; n.org.pay = st[0].pay_info; n.def.kas = st[0].def_kas || n.def.kas; n.def.dayak = st[0].def_dayak || n.def.dayak; n.sheetUrl = st[0].sheet_url || ''; }
  n.warga = wr.map(r => ({ id: r.id, nama: r.nama, alamat: r.alamat, wa: r.wa, status: r.status, kasFrom: r.kas_from, kasTo: r.kas_to, dayakFrom: r.dayak_from, dayakTo: r.dayak_to }));
  const hm = {}; sl.forEach(r => { (hm[r.warga_id] = hm[r.warga_id] || []).push({ m: r.mulai, s: r.status }); });
  n.warga.forEach(w => { if (hm[w.id]) { w.hist = hm[w.id]; normHist(w); } });
  let hasKas = false, hasDayak = false;
  it.forEach(r => {
    const prices = { singgah: r.price_singgah, kontrak: r.price_kontrak, tetap: r.price_tetap };
    if (r.kind === 'kas') { n.items.kas = { label: r.label, prices }; hasKas = true; }
    else if (r.kind === 'dayak') { n.items.dayak = { label: r.label, prices }; hasDayak = true; }
    else n.tambahan.push({ id: r.id, label: r.label, prices, target: r.target == null ? 'all' : r.target });
  });
  pm.forEach(r => { n.paid[r.key] = (r.paid_at || r.amount != null) ? { d: r.paid_at || '', a: r.amount } : 1; });
  n.trx = tx.map(r => ({ id: r.id, tipe: r.tipe, tgl: r.tanggal, kat: r.kategori, ket: r.keterangan, jml: r.jumlah, pos: r.pos }));
  const complete = st.length && hasKas && hasDayak;
  snap = complete ? toRows(n) : { settings: {}, warga: {}, status_log: {}, items: {}, payments: {}, transaksi: {} };
  n._push = !complete;
  return n;
}
function setSync(s) { syncState = s; const e = document.getElementById('syncst'); if (e) e.textContent = SYNC_TXT[s]; }
function save() {
  if (!sb || !snap) return;
  clearTimeout(saveT); setSync('pending');
  saveT = setTimeout(() => { saveT = 0; saving = saving.then(flush); }, 350);
}
async function flush() {
  if (!sb || !snap) return;
  setSync('saving');
  const next = toRows(S);
  try {
    for (const t of ORDER) {
      const up = [];
      for (const k in next[t]) if (!snap[t][k] || JSON.stringify(snap[t][k]) !== JSON.stringify(next[t][k])) up.push(next[t][k]);
      for (let i = 0; i < up.length; i += 500) {
        const { error } = await sb.from(t).upsert(up.slice(i, i + 500));
        if (error) throw error;
        up.slice(i, i + 500).forEach(r => { snap[t][r[PK[t]]] = r; });
      }
    }
    for (const t of [...ORDER].reverse()) {
      const del = Object.keys(snap[t]).filter(k => !(k in next[t]));
      for (let i = 0; i < del.length; i += 100) {
        const part = del.slice(i, i + 100);
        const { error } = await sb.from(t).delete().in(PK[t], part);
        if (error) throw error;
        part.forEach(k => { delete snap[t][k]; });
      }
    }
    setSync(saveT ? 'pending' : 'ok');
  } catch (e) { setSync('err'); toast('Gagal menyimpan: ' + (e.message || e)); }
}
window.addEventListener('beforeunload', e => { if (syncState !== 'ok') { e.preventDefault(); e.returnValue = ''; } });

/* ============ LOGIKA TAGIHAN ============ */
function targets(it, w) { return it.target === 'all' || (Array.isArray(it.target) && it.target.includes(w.id)); }
function rangeOf(w, t) { return [w[t + 'From'] || S.def[t], w[t + 'To'] || cur()]; }
function getItem(id) { return S.items[id] || S.tambahan.find(i => i.id === id); }
function monthCols(t) {
  const c = cur();
  if (!S.warga.length) return monthsBetween(S.def[t], c);
  const r = S.warga.map(w => rangeOf(w, t));
  const from = r.map(x => x[0]).sort()[0];
  const to = r.map(x => x[1]).sort().slice(-1)[0];
  return monthsBetween(from, to);
}
function dues(w) {
  const c = cur(), out = [];
  for (const t of TYPES) {
    const [f, to] = rangeOf(w, t);
    for (const m of monthsBetween(f, to < c ? to : c))
      out.push({ type: t, ym: m, amt: mAmt(t, w, m), paid: !!S.paid[t + '|' + w.id + '|' + m] });
  }
  for (const it of S.tambahan)
    if (targets(it, w)) out.push({ type: 't', id: it.id, amt: tAmt(it, w), paid: !!S.paid['t|' + it.id + '|' + w.id] });
  return out;
}
const unpaidOf = w => dues(w).filter(d => !d.paid).reduce((s, d) => s + d.amt, 0);

function buildInvoice(w) {
  const c = cur();
  const cats = [{ id: 'kas', title: S.items.kas.label }, { id: 'dayak', title: S.items.dayak.label }, { id: 't', title: 'Tambahan' }];
  const paid = { kas: [], dayak: [], t: [] }, unpaid = { kas: [], dayak: [], t: [] };
  for (const t of TYPES) {
    const [f, to] = rangeOf(w, t);
    for (const m of monthsBetween(f, to < c ? to : c))
      (S.paid[t + '|' + w.id + '|' + m] ? paid : unpaid)[t].push({ label: mLabel(m), amt: mAmt(t, w, m) });
  }
  for (const it of S.tambahan)
    if (targets(it, w)) (S.paid['t|' + it.id + '|' + w.id] ? paid : unpaid).t.push({ label: it.label, amt: tAmt(it, w) });
  const sum = o => Object.values(o).reduce((s, a) => s + a.reduce((x, r) => x + r.amt, 0), 0);
  const idx = S.warga.findIndex(x => x.id === w.id) + 1;
  return { w, cats, paid, unpaid, total: sum(unpaid), paidTotal: sum(paid), no: 'INV-' + c.replace('-', '') + '-' + String(idx).padStart(3, '0'), date: new Date(), period: c, org: S.org.name, pay: S.org.pay };
}

// Seluruh tagihan seorang warga (lunas & belum) untuk ditampilkan di kasir
function getWargaAllDues(w) {
  if (!w) return [];
  const c = cur(), out = [];
  for (const t of TYPES) {
    const [f, to] = rangeOf(w, t);
    for (const m of monthsBetween(f, to < c ? to : c)) {
      const key = t + '|' + w.id + '|' + m;
      out.push({
        key: key,
        type: t,
        ym: m,
        amt: mAmt(t, w, m),
        label: (t === 'kas' ? S.items.kas.label : S.items.dayak.label) + ' (' + mLabel(m) + ')',
        pos: t,
        paid: !!S.paid[key]
      });
    }
  }
  for (const it of S.tambahan) {
    if (targets(it, w)) {
      const key = 't|' + it.id + '|' + w.id;
      out.push({
        key: key,
        type: 't',
        id: it.id,
        amt: tAmt(it, w),
        label: it.label + ' (Tambahan)',
        pos: it.id,
        paid: !!S.paid[key]
      });
    }
  }
  return out;
}

// Hanya tagihan yang belum lunas (yang boleh masuk keranjang & dibayar)
function getWargaUnpaidDues(w) {
  return getWargaAllDues(w).filter(d => !d.paid).map(({ paid, ...d }) => d);
}

// Samakan "uang diterima" dengan total isi keranjang

  const w = S.warga.find(x => x.id === ui.kposWid);

}

function kasirPage() {
  const isUser = (ui.appMode === 'user');

  // Dalam Mode User: TIDAK ADA tab pengaturan atau riwayat (murni hanya transaksi)
  if (isUser) {
    ui.kposTab = 'pos';
    return kasirMainBody();

  // Dalam Mode Admin: Admin memiliki akses penuh ke Riwayat Transaksi dan Pengaturan Kasir/Midtrans
  const act = `

      ${ui.kposWid ? '<button class="btn sm" data-a="kposClearW">' + ico('x', 16) + 'Ganti Warga</button>' : ''}

  const tabs = [
    ['pos', 'Kasir Pembayaran', 'pos'],
    ['history', 'Riwayat Transaksi Pos (Admin)', 'receipt'],
    ['settings', 'Pengaturan Kasir &amp; Midtrans (Admin)', 'settings']
  ];

  const subnav = `
    <div class="pos-subnav">
      ${tabs.map(([id, l, ic]) => `

  return head('Kasir Pos', 'Pembayaran iuran langsung via QRIS/Midtrans dan Tunai', act) + subnav + body;
}

  const subtotTambahan = tambahanDues.filter(d => ui.kposSel.has(d.key)).reduce((s, x) => s + x.amt, 0);

let qrisPollTimer = null;
let qrisCountdownTimer = null;

function openCustomQrisModal(data) {
  const { order_id, gross_amount, qr_url, qr_string, items, warga, receipt_code } = data;
  
  // Gunakan gambar QR dari Midtrans jika ada, atau buat QR code via quickchart menggunakan qr_string/payment link
  const rawQrTarget = qr_string || (posCfg.workerUrl ? (posCfg.workerUrl + '/api/kasir/check-status?order_id=' + order_id) : ('https://simulator.sandbox.midtrans.com/qris/' + order_id));
  const finalQrImage = qr_url || ('https://quickchart.io/qr?text=' + encodeURIComponent(rawQrTarget) + '&size=260');

  modal(`
    <div class="mh">
      <h3>Pembayaran QRIS</h3>
      <button class="ib" data-a="closeQrisModal">${ico('x')}</button>
    </div>
    
    <div class="qris-modal-box">
      <div class="qris-header-badge">
        <span>●</span> Scan QRIS untuk Melakukan Pembayaran
      </div>

      <div class="qris-total-val">${rp(gross_amount)}</div>

      <div class="qris-qr-frame">
        <img alt="QRIS Code" src="${finalQrImage}">
      </div>

      <div class="qris-timer-box">
        <span>Batas waktu pembayaran:</span>
        <span class="qris-timer-val" id="qrisTimerText">15:00</span>
      </div>

      <div class="qris-supported-logos">
        <span class="qris-pill">BCA</span>
        <span class="qris-pill">Mandiri</span>
        <span class="qris-pill">BRI</span>
        <span class="qris-pill">BNI</span>
        <span class="qris-pill">GoPay</span>
        <span class="qris-pill">OVO</span>
        <span class="qris-pill">ShopeePay</span>
        <span class="qris-pill">Dana</span>
      </div>

      <div class="qris-status-live">
        <span>Menunggu pembayaran warga via QRIS...</span>
      </div>
    </div>

    <div class="mf" style="justify-content:center;gap:10px">
      <button class="btn ghost" data-a="kposCheckQrisNow" data-oid="${esc(order_id)}">Cek Status Sekarang</button>
      <button class="btn ghost" data-a="closeQrisModal">Batal</button>
      ${!posCfg.workerUrl ? `<button class="btn" data-a="kposSimulateQrisPaid" data-oid="${esc(order_id)}">Simulasi Lunas (Tes)</button>` : ''}
    </div>
  `);

  // Start 15 minute countdown
  let timeLeft = 15 * 60;
  clearInterval(qrisCountdownTimer);
  qrisCountdownTimer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(qrisCountdownTimer);
      clearInterval(qrisPollTimer);
      closeModal();
      toast('Waktu pembayaran QRIS telah habis.');
      return;
    }
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('qrisTimerText');
    if (el) el.textContent = pad2(m) + ':' + pad2(s);
  }, 1000);

  // Start real-time background status poller every 2.5s
  clearInterval(qrisPollTimer);
  qrisPollTimer = setInterval(async () => {
    if (!posCfg.workerUrl) return;
    try {
      const res = await fetch(posCfg.workerUrl + '/api/kasir/check-status?order_id=' + encodeURIComponent(order_id));
      if (!res.ok) return;
      const st = await res.json();
      if (st.payment_status === 'settlement') {
        clearInterval(qrisPollTimer);
        clearInterval(qrisCountdownTimer);
        closeModal();
        toast('Pembayaran QRIS Berhasil Terverifikasi!');

        const orderData = {
          order_id: order_id,
          receipt_code: receipt_code || st.receipt_code,
          warga_id: warga ? warga.id : '',
          warga_nama: warga ? warga.nama : (st.warga_nama || 'Warga'),
          warga_alamat: warga ? warga.alamat : (st.warga_alamat || '-'),
          gross_amount: gross_amount,
          payment_method: 'midtrans',
          payment_status: 'settlement',
          payment_type: st.payment_type || 'qris',
          items: items,
          cashier_name: posCfg.cashierName,
          settled_at: new Date().toISOString(),
          created_at: new Date().toISOString()
        };

        // Update local database
        const today = todayStr();
        items.forEach(it => {
          S.paid[it.key] = { d: today, a: it.amt };
        });
        save();
        savePosOrderHistory(orderData);

        // Reset search selection
        ui.kposWid = null;
        ui.kposSel = new Set();
        render();

        // Tampilkan Nota Pembayaran Resmi otomatis
        openNotaModal(orderData);
      }
    } catch(e) {}
  }, 2500);
}

/* ---------- Dashboard ---------- */
function dashboard() {
  let total = 0, paid = 0; const debtors = [], cat = {};
  for (const w of S.warga) {
    let un = 0;
    for (const x of dues(w)) {
      const k = x.type === 't' ? x.id : x.type;
      cat[k] = cat[k] || { tot: 0, paid: 0 };
      total += x.amt; cat[k].tot += x.amt;
      if (x.paid) { paid += x.amt; cat[k].paid += x.amt; } else un += x.amt;
    }
    if (un > 0) debtors.push({ w, un });
  }
  debtors.sort((a, b) => b.un - a.un);
  const pct = total ? Math.round(paid / total * 100) : 0;
  const catRows = Object.keys(cat).map(k => {
    const it = getItem(k), p = cat[k].tot ? cat[k].paid / cat[k].tot * 100 : 0;
    return `<div class="cat"><div class="row"><span>${esc(it ? it.label : k)}</span><span>${rp(cat[k].paid)} / ${rp(cat[k].tot)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join('') || '<p class="hint">Belum ada data.</p>';
  const dl = debtors.slice(0, 8).map(d => `<button class="li" data-a="inv" data-w="${d.w.id}"><span class="av">${esc(initial(d.w.nama))}</span><span class="grow"><b>${esc(d.w.nama)}</b><small>${esc(d.w.alamat || '')} · ${STATUS_LABEL[d.w.status]}</small></span><span class="amt">${rp(d.un)}</span></button>`).join('') || `<div class="empty">${ico('check', 30)}<div>Semua warga sudah lunas</div></div>`;
  return head('Dashboard', 'Ringkasan tagihan sampai ' + mLabel(cur())) +
    `<div class="grid4">
      <div class="card stat"><div class="top">${ico('receipt', 18)}Total tagihan</div><b>${rp(total)}</b><small>${S.warga.length} warga</small></div>

/* ---------- Pencarian fleksibel: nama, blok / no. rumah, WhatsApp, status ---------- */
const alnum = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const stripAddr = s => String(s || '').toLowerCase().replace(/\b(blok|block|no|nomor|rt|rw|jl|jalan|rumah)\b\.?/g, ' ');
function matchWarga(w, q) {
  const toks = String(q || '').toLowerCase().split(/[\s,]+/).filter(Boolean);
  if (!toks.length) return true;
  const hay = [w.nama, w.alamat, STATUS_LABEL[w.status]].join(' ').toLowerCase();
  const compact = alnum(hay), addr = alnum(stripAddr(w.alamat)), wa = String(w.wa || '').replace(/\D/g, '');
  const whole = alnum(q);
  if (whole && (addr.includes(whole) || compact.includes(whole))) return true;
  return toks.every(t => { const c = alnum(t); return hay.includes(t) || (c && (compact.includes(c) || addr.includes(c) || (/^\d{3,}$/.test(c) && wa.includes(c)))); });
}

function monthlyTable(t, list) {
  if (!list.length) return empty('Tidak ada warga');
  const c = cur(), cols = monthCols(t);
  let h = `<div class="tbl-wrap"><table><thead><tr><th>Nama</th>` +
    cols.map(m => `<th class="${m === c ? 'cur' : ''}">${MONTHS_ID[+m.slice(5) - 1]}<small>${m.slice(0, 4)}</small></th>`).join('') +
    `<th>Belum lunas</th></tr></thead><tbody>`;
  for (const w of list) {
    const [f, to] = rangeOf(w, t); let nb = 0, nbAmt = 0;

      if (m < f || m > to) { h += '<td><span class="na">–</span></td>'; continue; }
      const p = !!S.paid[t + '|' + w.id + '|' + m];

      h += `<td><button class="chip ${p ? 'ok' : 'no'} ${m > c ? 'fut' : ''}" title="${STATUS_LABEL[stAt(w, m)]} · ${rp(mAmt(t, w, m))}" data-a="tog" data-t="${t}" data-w="${w.id}" data-m="${m}">${p ? 'Lunas' : 'Belum'}</button></td>`;

function modal(html, cls = '') { $('#modal').innerHTML = `<div class="backdrop"><div class="sheet ${cls}" role="dialog">${html}</div></div>`; document.body.classList.add('lock'); }

/* ============ INVOICE (GAMBAR) ============ */
const C = { ACC: '#6f86d6', ACC_S: '#eef1fc', INK: '#2b3042', MUT: '#8a90a6', LINE: '#eceef5', BG: '#f6f7fb', OK: '#3d8a5f', OK_S: '#e7f5ed', NO: '#c25b5b', NO_S: '#fdeeee' };
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawInvoice(ctx, inv, W, H, draw) {
  const P = 36, FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const f = (wt, sz) => `${wt} ${sz}px ${FONT}`;
  const txt = (s, x, y, font, color, al) => { if (!draw) return; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = al || 'left'; ctx.fillText(s, x, y); };
  const box = (x, y, w, h, r, fill) => { if (!draw) return; rr(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); };
  const wrap = (s, max, font) => { ctx.font = font; const out = []; for (const para of String(s).split('\n')) { let line = ''; for (const word of para.split(' ')) { const t = line ? line + ' ' + word : word; if (ctx.measureText(t).width > max && line) { out.push(line); line = word; } else line = t; } out.push(line); } return out; };
  if (draw) ctx.textBaseline = 'alphabetic';
  box(0, 0, W, H, 0, '#ffffff');
  box(0, 0, W, 118, 0, C.ACC_S);
  txt('INVOICE', P, 50, f('700', 26), C.ACC);
  txt(inv.org, P, 76, f('500', 14), C.MUT);
  txt(inv.no, W - P, 48, f('600', 13), C.INK, 'right');
  txt('Tanggal ' + fmtDate(inv.date), W - P, 70, f('400', 12.5), C.MUT, 'right');
  txt('Tagihan s/d ' + mLabel(inv.period), W - P, 90, f('400', 12.5), C.MUT, 'right');
  let y = 152;
  txt('DITAGIHKAN KEPADA', P, y, f('600', 11), C.MUT); y += 26;
  txt(inv.w.nama, P, y, f('700', 20), C.INK);
  const lunas = inv.total === 0, bl = lunas ? 'LUNAS' : 'BELUM LUNAS';
  ctx.font = f('700', 11); const bw = ctx.measureText(bl).width + 28;
  box(W - P - bw, y - 20, bw, 28, 14, lunas ? C.OK_S : C.NO_S);
  txt(bl, W - P - bw / 2, y - 2, f('700', 11), lunas ? C.OK : C.NO, 'center');
  y += 22;
  txt([inv.w.alamat, STATUS_LABEL[inv.w.status]].filter(Boolean).join(' · '), P, y, f('400', 13), C.MUT); y += 30;

  const L = P + 14, R = W - P - 14, maxL = R - L - 140;
  // satu bagian (lunas / belum lunas), dikelompokkan per kategori
  const section = (title, tot, fg, bg, rows, mark, amtColor) => {
    box(P, y, W - 2 * P, 36, 10, bg);
    txt(title, L, y + 23, f('700', 12.5), fg); txt(rp(tot), R, y + 23, f('700', 13.5), fg, 'right');
    y += 36;
    let any = false;
    for (const c of inv.cats) {
      const r = rows[c.id]; if (!r.length) continue;
      any = true;
      y += 30;
      txt(c.title, L, y, f('700', 13.5), C.INK);
      txt(r.length + ' item · ' + rp(r.reduce((s, x) => s + x.amt, 0)), R, y, f('500', 12), C.MUT, 'right');
      for (const it of r) {
        const ls = wrap(it.label, maxL, f('400', 13));
        y += 24;
        txt(mark, L + 4, y, f('600', 13), fg);

async function syncSettlementOrder(orderId, dues, w, grossAmount, receiptCode, paymentType = 'qris') {
  const today = todayStr();
  dues.forEach(it => {
    S.paid[it.key] = { d: today, a: it.amt };
    S.trx.push({
      id: uid('x'),
      tipe: 'masuk',
      tgl: today,
      kat: it.type === 'kas' ? 'Kas Warga' : it.type === 'dayak' ? 'Gaji Dayak' : 'Tambahan',
      ket: `${w.nama} (${w.alamat || '-'}) · ${it.label} [MIDTRANS ${paymentType.toUpperCase()} - ${orderId}]`,
      jml: it.amt,
      pos: it.pos
    });
  });

  save();

  const orderData = {
    order_id: orderId,
    warga_id: w.id,
    warga_nama: w.nama,
    warga_alamat: w.alamat || '-',
    gross_amount: grossAmount,
    payment_method: 'midtrans',
    payment_status: 'settlement',
    payment_type: paymentType,
    items: dues,
    items_detail: dues,
    cashier_name: posCfg.cashierName,
    receipt_code: receiptCode,
    settled_at: new Date().toISOString(),
    created_at: new Date().toISOString()
  };

  savePosOrderHistory(orderData);
  ui.kposWid = null;
  ui.kposSel = new Set();
  render();
  openNotaModal(orderData);
}

// Background status poller saat status pending di layar kasir
function startStatusPolling(orderId, dues, w, grossAmount, receiptCode) {
  if (!posCfg.workerUrl) return;
  let attempts = 0;
  const timer = setInterval(async () => {
    attempts++;
    if (attempts > 30) {
      clearInterval(timer);
      return;
    }
    try {
      const res = await fetch(posCfg.workerUrl + '/api/kasir/check-status?order_id=' + encodeURIComponent(orderId));
      if (!res.ok) return;
      const data = await res.json();
      if (data.payment_status === 'settlement') {
        clearInterval(timer);
        toast('Pembayaran ' + orderId + ' berhasil terkonfirmasi!');
        syncSettlementOrder(orderId, dues, w, grossAmount, receiptCode, data.payment_type || 'qris');
      }
    } catch(e) {}
  }, 3000);
}

const SHEETS = { trx: 'Transaksi', warga: 'Warga', harga: 'Harga', kas: 'Kas', dayak: 'Gaji Dayak', tambahan: 'Tambahan', set: 'Pengaturan' };
const norm = s => String(s == null ? '' : s).trim().toLowerCase();
const ymTxt = ym => ym ? mLabel(ym) : '';
const MON3 = ['jan', 'feb', 'mar', 'apr', 'mei', 'jun', 'jul', 'agu', 'sep', 'okt', 'nov', 'des'];
const MON_EN = { may: 4, aug: 7, oct: 9, dec: 11 };
function monthIdx(name) { const k = name.slice(0, 3); const i = MON3.indexOf(k); return i >= 0 ? i : (k in MON_EN ? MON_EN[k] : -1); }
function parseYM(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600e3); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1); }
  if (typeof v === 'number') { if (v < 30000) return ''; const d = new Date(Math.round((v - 25569) * 86400e3)); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1); }
  const s = String(v).trim().toLowerCase();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})/); if (m) return m[1] + '-' + pad2(+m[2]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{4})$/); if (m) return m[2] + '-' + pad2(+m[1]);
  m = s.match(/^([a-z]+)[\s\-\/']*(\d{2,4})$/);
  if (m) { const i = monthIdx(m[1]); if (i >= 0) { let y = +m[2]; if (y < 100) y += 2000; return y + '-' + pad2(i + 1); } }
  return '';
}
const isPaidVal = v => ['lunas', 'ya', 'yes', 'y', '1', 'x', 'v', '✓', 'paid', 'true', 'sudah', 'sudah lunas'].includes(norm(v));
const numVal = v => typeof v === 'number' ? Math.max(0, v) : (+String(v == null ? '' : v).replace(/[^\d]/g, '') || 0);
const statusFrom = v => { const s = norm(v); return s.includes('singgah') ? 'singgah' : s.includes('kontrak') ? 'kontrak' : 'tetap'; };

function toSheets() {
  const out = {};
  out[SHEETS.warga] = [['Nama', 'Alamat', 'WhatsApp', 'Status', 'Kas mulai', 'Kas sampai', 'Dayak mulai', 'Dayak sampai']]
    .concat(S.warga.map(w => [w.nama, w.alamat || '', w.wa || '', STATUS_LABEL[w.status], ymTxt(w.kasFrom), ymTxt(w.kasTo), ymTxt(w.dayakFrom), ymTxt(w.dayakTo)]));
  const byId = {}; S.warga.forEach(w => byId[w.id] = w.nama);
  out[SHEETS.harga] = [['Item', 'Jenis', 'Singgah', 'Kontrak', 'Tetap', 'Ditagihkan ke'],
    [S.items.kas.label, 'Kas', S.items.kas.prices.singgah, S.items.kas.prices.kontrak, S.items.kas.prices.tetap, 'Semua'],
    [S.items.dayak.label, 'Gaji Dayak', S.items.dayak.prices.singgah, S.items.dayak.prices.kontrak, S.items.dayak.prices.tetap, 'Semua']]
    .concat(S.tambahan.map(i => [i.label, 'Tambahan', i.prices.singgah, i.prices.kontrak, i.prices.tetap, i.target === 'all' ? 'Semua' : i.target.map(id => byId[id]).filter(Boolean).join('; ')]));
  for (const t of TYPES) {
    const cols = monthCols(t);
    out[SHEETS[t]] = [['Nama'].concat(cols.map(mLabel))].concat(S.warga.map(w => {
      const [f, to] = rangeOf(w, t);
      return [w.nama].concat(cols.map(m => (m < f || m > to) ? '' : (S.paid[t + '|' + w.id + '|' + m] ? 'Lunas' : 'Belum')));
    }));
  }
  out[SHEETS.tambahan] = [['Nama'].concat(S.tambahan.map(i => i.label))].concat(S.warga.map(w =>
    [w.nama].concat(S.tambahan.map(i => targets(i, w) ? (S.paid['t|' + i.id + '|' + w.id] ? 'Lunas' : 'Belum') : ''))));
  out[SHEETS.set] = [['Kunci', 'Nilai'], ['Nama organisasi', S.org.name], ['Informasi pembayaran', S.org.pay],
    ['Bawaan Kas mulai', mLabel(S.def.kas)], ['Bawaan Gaji Dayak mulai', mLabel(S.def.dayak)]];
  out[SHEETS.trx] = [['Tipe', 'Tanggal', 'Kategori', 'Keterangan', 'Jumlah', 'Pos']].concat((S.trx || []).map(x => [x.tipe === 'masuk' ? 'Masuk' : 'Keluar', x.tgl, x.kat, x.ket, x.jml, posName(x.pos)]));
  return out;
}

function fromSheets(sh) {
  const wr = sh[SHEETS.warga];
  if (!wr || wr.length < 2) throw new Error('Tab "Warga" tidak ditemukan atau kosong');
  const hdr = wr[0].map(norm), col = (...ns) => hdr.findIndex(h => ns.includes(h));
  const iN = col('nama'), iA = col('alamat', 'blok', 'alamat / blok'), iW = col('whatsapp', 'wa', 'no. whatsapp', 'no wa', 'hp'), iS = col('status', 'status tinggal');
  const iKf = col('kas mulai'), iKt = col('kas sampai'), iDf = col('dayak mulai', 'gaji dayak mulai'), iDt = col('dayak sampai', 'gaji dayak sampai');
  if (iN < 0) throw new Error('Tab "Warga" harus punya kolom "Nama"');
  const n = { org: Object.assign({}, S.org), def: Object.assign({}, S.def), items: JSON.parse(JSON.stringify(S.items)), tambahan: [], warga: [], paid: {}, trx: (S.trx || []).slice(), sheetUrl: S.sheetUrl || '' };
  const byName = {};
  for (const r of wr.slice(1)) {
    const nama = String(r[iN] == null ? '' : r[iN]).trim();
    if (!nama || byName[norm(nama)]) continue;
    const w = { id: 'w' + (n.warga.length + 1), nama, alamat: iA >= 0 ? String(r[iA] || '').trim() : '', wa: iW >= 0 ? String(r[iW] || '').trim() : '', status: iS >= 0 ? statusFrom(r[iS]) : 'tetap',
      kasFrom: iKf >= 0 ? parseYM(r[iKf]) : '', kasTo: iKt >= 0 ? parseYM(r[iKt]) : '', dayakFrom: iDf >= 0 ? parseYM(r[iDf]) : '', dayakTo: iDt >= 0 ? parseYM(r[iDt]) : '' };
    n.warga.push(w); byName[norm(nama)] = w;
  }
  const st = sh[SHEETS.set];
  if (st) for (const r of st.slice(1)) {
    const k = norm(r[0]), v = r[1];
    if (k === 'nama organisasi') n.org.name = String(v || '');
    else if (k === 'informasi pembayaran') n.org.pay = String(v || '');
    else if (k === 'bawaan kas mulai') { const y = parseYM(v); if (y) n.def.kas = y; }
    else if (k === 'bawaan gaji dayak mulai') { const y = parseYM(v); if (y) n.def.dayak = y; }
  }
  const hg = sh[SHEETS.harga];
  if (hg && hg.length) {
    const h = hg[0].map(norm), c2 = k => h.indexOf(k), iI = c2('item'), iJ = c2('jenis'), iT = c2('ditagihkan ke');
    if (iI >= 0 && iJ >= 0) for (const r of hg.slice(1)) {
      const label = String(r[iI] || '').trim(); if (!label) continue;
      const prices = { singgah: numVal(r[c2('singgah')]), kontrak: numVal(r[c2('kontrak')]), tetap: numVal(r[c2('tetap')]) };
      const j = norm(r[iJ]);
      if (j === 'kas') n.items.kas = { label, prices };
      else if (j === 'gaji dayak' || j === 'dayak') n.items.dayak = { label, prices };
      else {
        const tv = norm(iT >= 0 ? r[iT] : '');
        let target = 'all';
        if (tv && tv !== 'semua' && tv !== 'all') target = String(r[iT]).split(/[;,\n]/).map(x => byName[norm(x)]).filter(Boolean).map(w => w.id);
        n.tambahan.push({ id: 't' + (n.tambahan.length + 1), label, prices, target });
      }
    }
  }
  for (const t of TYPES) {
    const m = sh[SHEETS[t]]; if (!m || m.length < 2) continue;
    const yms = m[0].slice(1).map(parseYM);
    if (!yms.some(Boolean)) continue;
    for (const r of m.slice(1)) {
      const w = byName[norm(r[0])]; if (!w) continue;
      yms.forEach((ym, j) => {
        const v = r[j + 1]; if (!ym || v == null || norm(v) === '') return;
        if (isPaidVal(v)) n.paid[t + '|' + w.id + '|' + ym] = oldPaid(t + '|' + oldWid(w.nama) + '|' + ym);
        if (iKf < 0 && t === 'kas' || iDf < 0 && t === 'dayak') { const k = t + 'From'; if (!w[k] || ym < w[k]) w[k] = ym; }
      });
    }
  }
  const tm = sh[SHEETS.tambahan];
  if (tm && tm.length) {
    const th = tm[0].map(x => String(x == null ? '' : x).trim());
    if (!th.map(norm).includes('status')) {
      const ids = th.map((lab, j) => {
        if (j === 0 || !lab) return null;
        let it = n.tambahan.find(x => norm(x.label) === norm(lab));
        if (!it) { it = { id: 't' + (n.tambahan.length + 1), label: lab, prices: { singgah: 0, kontrak: 0, tetap: 0 }, target: 'all' }; n.tambahan.push(it); }
        return it.id;
      });
      for (const r of tm.slice(1)) {
        const w = byName[norm(r[0])]; if (!w) continue;
        ids.forEach((id, j) => { if (id && isPaidVal(r[j])) n.paid['t|' + id + '|' + w.id] = oldPaid('t|' + oldTid(th[j]) + '|' + oldWid(w.nama)); });
      }
    }
  }
  const tx = sh[SHEETS.trx];
  if (tx && tx.length > 1) {
    const h = tx[0].map(norm), c3 = k => h.indexOf(k);
    const iTp = c3('tipe'), iTg = c3('tanggal'), iK = c3('kategori'), iE = c3('keterangan'), iJ2 = c3('jumlah'), iP = c3('pos');
    if (iTp >= 0 && iTg >= 0 && iJ2 >= 0) {
      const posMap = { umum: 'umum' };
      posMap[norm(n.items.kas.label)] = 'kas'; posMap[norm(n.items.dayak.label)] = 'dayak';
      n.tambahan.forEach(i => { posMap[norm(i.label)] = i.id; });
      n.trx = [];
      for (const r of tx.slice(1)) {
        const tp = norm(r[iTp]).startsWith('masuk') ? 'masuk' : norm(r[iTp]).startsWith('keluar') ? 'keluar' : '';
        const tgl = parseDate(r[iTg]), jml = numVal(r[iJ2]);
        if (!tp || !tgl || !jml) continue;
        n.trx.push({ id: uid('x'), tipe: tp, tgl, kat: iK >= 0 ? String(r[iK] || '').trim() : '', ket: iE >= 0 ? String(r[iE] || '').trim() : '', jml, pos: posMap[norm(iP >= 0 ? r[iP] : '')] || 'umum' });
      }
    }
  }
  return n;
}

let xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxP) return xlsxP;
  xlsxP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxP = null; rej(new Error('lib')); };
    document.head.appendChild(s);
  });
  return xlsxP;
}

function applySheets(sh, src) {

  S = n; save(); render(); toast('Data diimpor: ' + n.warga.length + ' warga');

async function importXlsx(file) {
  let X; try { X = await loadXLSX(); } catch (e) { toast('Pustaka Excel gagal dimuat. Perlu internet.'); return; }
  try {
    const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true }), sh = {};
    for (const nm of wb.SheetNames) {
      const canon = Object.values(SHEETS).find(c => norm(c) === norm(nm));
      if (canon) sh[canon] = X.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, defval: '' });
    }
    applySheets(sh, 'file Excel');
  } catch (e) { toast('File Excel tidak bisa dibaca'); }
}
function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; }
    else f += ch;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows.filter(x => x.some(c => String(c).trim() !== ''));
}
function gsMsg(t, bad) {

async function pullGoogle() {
  const url = ($('#gsUrl') ? $('#gsUrl').value : S.sheetUrl || '').trim();
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || (/^[a-zA-Z0-9_-]{25,}$/.test(url) ? [0, url] : null);
  if (!m) { gsMsg('Link tidak dikenali. Tempel link lengkap Google Sheet (mengandung /d/...).', true); return; }
  S.sheetUrl = url; save();
  gsMsg('Mengambil data...', false);
  const sh = {};
  try {
    for (const name of Object.values(SHEETS)) {
      let res;
      try { res = await fetch('https://docs.google.com/spreadsheets/d/' + m[1] + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(name)); }
      catch (e) { throw new Error('NET'); }
      if (!res.ok) { if (name === SHEETS.warga) throw new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      if (/^\s*</.test(text)) { if (name === SHEETS.warga) throw new Error('HTML'); continue; }
      sh[name] = parseCSV(text);
    }
  } catch (e) {
    const k = e.message;
    gsMsg(k === 'NET'
      ? 'Browser tidak bisa menjangkau Google Sheet. Penyebab umum: (1) sheet belum dibagikan ke "Siapa saja yang memiliki link" sebagai Pelihat, (2) file HTML dibuka dari pratinjau/aplikasi yang memblokir akses internet. Coba buka file ini langsung di Chrome. Kalau tetap gagal, gunakan sambungan Apps Script.'
      : k === 'HTML'
        ? 'Google mengirim halaman login, bukan data. Bagikan sheet ke "Siapa saja yang memiliki link" sebagai Pelihat.'
        : 'Google menolak permintaan (' + k + '). Pastikan file adalah Google Sheet asli (jika .xlsx di Drive: buka lalu File → Save as Google Sheets) dan ada tab bernama "Warga".', true);
    return;
  }
  gsMsg('Terhubung, memproses data...', false);
  applySheets(sh, 'Google Sheet');
}

};

/* ============ KEUANGAN: PEMASUKAN, PENGELUARAN, LAPORAN ============ */
const KAT_MASUK = ['Donasi', 'Sumbangan', 'Bunga bank', 'Sewa fasilitas', 'Lainnya'];
const KAT_KELUAR = ['Gaji dayak', 'Listrik', 'Air', 'Perbaikan', 'Kebersihan', 'Keamanan', 'Kegiatan / acara', 'Administrasi', 'Lainnya'];
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fmtD = s => { if (!s) return 'Tanpa tanggal'; const p = s.split('-'); return (+p[2]) + ' ' + MONTHS_ID[+p[1] - 1] + ' ' + p[0]; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sumJ = a => a.reduce((x, r) => x + (r.jml || 0), 0);
function parseDate(v) {
  if (v == null || v === '') return '';
  const utc = d => d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  if (v instanceof Date && !isNaN(v)) return utc(new Date(v.getTime() + 12 * 3600e3));
  if (typeof v === 'number') return v < 30000 ? '' : utc(new Date(Math.round((v - 25569) * 86400e3)));
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (m) return m[3] + '-' + pad2(+m[2]) + '-' + pad2(+m[1]);
  return '';
}
function oldPaid(k) { const o = S.paid[k]; return (o && typeof o === 'object') ? o : 1; }
function oldWid(nama) { const w = S.warga.find(x => norm(x.nama) === norm(nama)); return w ? w.id : ''; }
function oldTid(label) { const i = S.tambahan.find(x => norm(x.label) === norm(label)); return i ? i.id : ''; }

function posList() { return [['umum', 'Umum'], ['kas', S.items.kas.label], ['dayak', S.items.dayak.label]].concat(S.tambahan.map(i => [i.id, i.label])); }
function posName(id) { const p = posList().find(x => x[0] === id); return p ? p[1] : '(item dihapus)'; }

function payRows() {
  const out = [], wm = {};
  S.warga.forEach(w => { wm[w.id] = w; });
  for (const k in S.paid) {
    const p = k.split('|'), t = p[0] === 't', w = wm[t ? p[2] : p[1]]; if (!w) continue;
    const it = t ? S.tambahan.find(i => i.id === p[1]) : S.items[p[0]]; if (!it) continue;
    const v = S.paid[k], o = (v && typeof v === 'object') ? v : {}, ym = t ? '' : p[2];
    out.push({ src: 'tagihan', tipe: 'masuk', key: k, pos: t ? p[1] : p[0], kat: it.label,
      ket: w.nama + (w.alamat ? ' (' + w.alamat + ')' : '') + (ym ? ' · ' + mLabel(ym) : ''),
      jml: o.a != null ? o.a : (it.prices[ym ? stAt(w, ym) : w.status] || 0), tgl: o.d || (ym ? ym + '-01' : ''), est: !o.d });
  }
  return out;
}
const trxRow = x => ({ src: 'manual', tipe: x.tipe, id: x.id, tgl: x.tgl, kat: x.kat, ket: x.ket, jml: x.jml, pos: x.pos });
const allIncome = () => payRows().concat(S.trx.filter(x => x.tipe === 'masuk').map(trxRow));
const allExpense = () => S.trx.filter(x => x.tipe === 'keluar').map(trxRow);

function period() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1, last = (a, b) => new Date(a, b, 0).getDate();
  if (ui.kp === 'bln') return [y + '-' + pad2(m) + '-01', y + '-' + pad2(m) + '-' + pad2(last(y, m))];
  if (ui.kp === 'lalu') { let yy = y, mm = m - 1; if (mm < 1) { mm = 12; yy--; } return [yy + '-' + pad2(mm) + '-01', yy + '-' + pad2(mm) + '-' + pad2(last(yy, mm))]; }
  if (ui.kp === 'thn') return [y + '-01-01', y + '-12-31'];
  if (ui.kp === 'custom') return [ui.kf || '', ui.kt || ''];
  return ['', ''];
}
function inP(tgl, P) { if (!P[0] && !P[1]) return true; if (P[0] && tgl < P[0]) return false; if (P[1] && tgl > P[1]) return false; return true; }
function periodLabel() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if (ui.kp === 'bln') return MONTHS_FULL[m] + ' ' + y;
  if (ui.kp === 'lalu') return m ? MONTHS_FULL[m - 1] + ' ' + y : MONTHS_FULL[11] + ' ' + (y - 1);
  if (ui.kp === 'thn') return 'Tahun ' + y;
  if (ui.kp === 'custom') { const P = period(); return (P[0] ? fmtD(P[0]) : 'awal') + ' s/d ' + (P[1] ? fmtD(P[1]) : 'sekarang'); }
  return 'Semua periode';
}

const kStat = (ic, l, v, sub) => `<div class="card stat"><div class="top">${ico(ic, 18)}${l}</div><b>${v}</b><small>${sub || ''}</small></div>`;
function bars(list, color) {

  return list.length ? list.map(x => `<div class="cat"><div class="row"><span>${esc(x[0] || '(tanpa kategori)')}</span><span>${rp(x[1])} · ${tot ? Math.round(x[1] / tot * 100) : 0}%</span></div><div class="bar"><i style="width:${mx ? x[1] / mx * 100 : 0}%;background:${color}"></i></div></div>`).join('') : '<p class="hint">Belum ada data.</p>';
}
function tbl(heads, rows) {
  return `<div class="tbl-wrap" style="max-height:none"><table><thead><tr>${heads.map((h, i) => `<th class="${i ? 'r' : 'l'}">${h}</th>`).join('')}</tr></thead><tbody>` +

}
function periodBar() {

function keuanganPage() {
  const tabs = [['masuk', 'Pemasukan'], ['keluar', 'Pengeluaran'], ['laporan', 'Laporan']];
  const act = ui.ktab === 'laporan' ? '' : `<button class="btn" data-a="xAdd" data-tp="${ui.ktab}">${ico('plus', 18)}${ui.ktab === 'masuk' ? 'Pemasukan' : 'Pengeluaran'}</button>`;

const kBody = () => ui.ktab === 'masuk' ? masukBody() : ui.ktab === 'keluar' ? keluarBody() : laporanBody();
function renderK() { const el = $('#kBody'); if (el) el.innerHTML = kBody(); }
const moreBtn = (n, shown) => n > shown ? `<div style="text-align:center;margin-top:12px"><button class="btn ghost" data-a="kmore">Tampilkan lebih banyak (${n - shown})</button></div>` : '';

function masukBody() {
  const P = period(), q = norm(ui.kq), all = allIncome().filter(r => inP(r.tgl, P));
  let rows = all;
  if (ui.ksrc !== 'all') rows = rows.filter(r => r.src === ui.ksrc);
  if (q) rows = rows.filter(r => norm(r.kat + ' ' + r.ket).includes(q));

  return `<div class="grid4">${kStat('trend', 'Total pemasukan', rp(sumJ(all)), periodLabel())}${kStat('users', 'Dari tagihan warga', rp(sumJ(tg)), tg.length + ' pembayaran')}${kStat('wallet', 'Pemasukan lain', rp(sumJ(mn)), mn.length + ' transaksi')}${kStat('receipt', 'Ditampilkan', rows.length, 'sesuai filter')}</div>
  <div class="tools"><div class="seg">${seg.map(s => `<button class="${ui.ksrc === s[0] ? 'on' : ''}" data-a="ksrc" data-v="${s[0]}">${s[1]}</button>`).join('')}</div></div>` +
    (rows.length ? `<div class="tbl-wrap"><table><thead><tr><th class="l">Tanggal</th><th class="l">Sumber</th><th class="l">Kategori</th><th class="l">Keterangan</th><th>Jumlah</th><th></th></tr></thead><tbody>` +
      shown.map(r => `<tr><td>${r.est && r.tgl ? '<span class="hint">±</span> ' : ''}${fmtD(r.tgl)}</td><td class="l">${r.src === 'tagihan' ? '<span class="badge b-kontrak">Tagihan</span>' : '<span class="badge b-tetap">Lain</span>'}</td><td class="l">${esc(r.kat)}</td><td class="l">${esc(r.ket)}</td><td class="r"><b class="okt">${rp(r.jml)}</b></td><td class="r"><button class="ib" title="Ubah" data-a="${r.src === 'tagihan' ? 'pEdit' : 'xEdit'}" data-k="${esc(r.key || r.id)}">${ico('edit', 18)}</button></td></tr>`).join('') +
      `</tbody></table></div>` + moreBtn(rows.length, shown.length) + `<div class="legend"><span>± = tanggal bayar tidak tercatat, dihitung di bulan tagihannya. Ketuk ikon pensil untuk mengisi tanggal.</span></div>` : empty('Belum ada pemasukan pada periode ini', 'wallet'));
}

function keluarBody() {
  const P = period(), q = norm(ui.kq);
  const all = allExpense().filter(r => inP(r.tgl, P));
  let rows = all.filter(r => !q || norm(r.kat + ' ' + r.ket + ' ' + posName(r.pos)).includes(q));

  ${kat.length ? `<div class="card" style="margin-bottom:14px"><h3>Per kategori</h3><p class="sub">Porsi pengeluaran pada periode ini</p>${bars(kat, 'var(--no)')}</div>` : ''}` +
    (rows.length ? `<div class="tbl-wrap"><table><thead><tr><th class="l">Tanggal</th><th class="l">Pos dana</th><th class="l">Kategori</th><th class="l">Keterangan</th><th>Jumlah</th><th></th></tr></thead><tbody>` +
      shown.map(r => `<tr><td>${fmtD(r.tgl)}</td><td class="l">${esc(posName(r.pos))}</td><td class="l">${esc(r.kat)}</td><td class="l">${esc(r.ket)}</td><td class="r"><b class="amt">${rp(r.jml)}</b></td><td class="r"><button class="ib" title="Ubah" data-a="xEdit" data-k="${esc(r.id)}">${ico('edit', 18)}</button><button class="ib" title="Hapus" data-a="xDel" data-k="${esc(r.id)}">${ico('trash', 18)}</button></td></tr>`).join('') +
      `</tbody></table></div>` + moreBtn(rows.length, shown.length) : empty('Belum ada pengeluaran pada periode ini', 'receipt'));
}
